version: "1.2"
entity_types:
  Material:
    label: 材料
    description: 材料、化合物、矿物或物质名称
  Property:
    label: 性质
    description: 材料的物理、化学或力学性质
  Process:
    label: 工艺
    description: 制备、处理、反应或加工过程
  Condition:
    label: 条件
    description: 温度、压力、时间、环境等条件
  Structure:
    label: 结构
    description: 晶体、微观、界面或几何结构
  Phase:
    label: 相
    description: 晶相、物相或相态
  Defect:
    label: 缺陷
    description: 空位、位错、晶界等缺陷
  Phenomenon:
    label: 现象
    description: 实验或理论观察到的现象
  Mechanism:
    label: 机制
    description: 物理、化学或演化机制
  Method:
    label: 方法
    description: 计算、实验、表征或分析方法
  Instrument:
    label: 仪器
    description: 实验仪器或测量设备
  Model:
    label: 模型
    description: 理论模型、计算模型或方程
  Parameter:
    label: 参数
    description: 模型参数或实验参数
  Value:
    label: 数值
    description: 测量值、计算值或数值范围
  Unit:
    label: 单位
    description: 物理量单位
  Application:
    label: 应用
    description: 材料或方法的用途及应用场景
